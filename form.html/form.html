<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Post a review for a product you have installed.">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header><h1>Product Review</h1></header>
  <main>
    <form method="get" action="review.html">
      <div class="field">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Overall Rating</legend>
        <div class="stars">
          <input type="radio" id="rate1" name="rating" value="1" required>
          <label for="rate1">1 &star;</label>
          <input type="radio" id="rate2" name="rating" value="2">
          <label for="rate2">2 &star;</label>
          <input type="radio" id="rate3" name="rating" value="3">
          <label for="rate3">3 &star;</label>
          <input type="radio" id="rate4" name="rating" value="4">
          <label for="rate4">4 &star;</label>
          <input type="radio" id="rate5" name="rating" value="5">
          <label for="rate5">5 &star;</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="field">
        <legend>Which features did you find useful? <em>(Check all that apply)</em></legend>
        <div class="checks">
          <input type="checkbox" id="durability" name="features" value="durability">
          <label for="durability">Durability</label>
          <input type="checkbox" id="easeOfUse" name="features" value="ease-of-use">
          <label for="easeOfUse">Ease of Use</label>
          <input type="checkbox" id="performance" name="features" value="performance">
          <label for="performance">Performance</label>
          <input type="checkbox" id="design" name="features" value="design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="writtenReview">Written Review <small>(Optional)</small></label>
        <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="userName">Your Name <small>(Optional)</small></label>
        <input type="text" id="userName" name="userName">
      </div>

      <input type="submit" value="Post Review">
    </form>
  </main>
  <footer>
    <p>&copy; <span id="year"></span> Ayomide &ndash; Nigeria</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
